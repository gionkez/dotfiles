[main]
font='Iosevka NFM:size=12:weight=normal'
use-bold=yes
dpi-aware=no
gamma-correct=no
placeholder='..'
prompt='> '
icons-enabled=false
hide-before-typing=yes
match-mode=fzf
sort-result=yes
match-counter=no
anchor=bottom-left
x-margin=15
y-margin=15
lines=5
width=25
horizontal-pad=10
vertical-pad=10
inner-pad=0
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
cache=/dev/null
auto-select=yes
enable-mouse=yes

[colors]
background='fffcffff'
text='171917ff'
prompt='008b8bff'
placeholder='008b8bff'
input='171917ff'
match='008b8bff'
selection='ff6d6dff'
selection-text='171917ff'
selection-match='fffcffff'
border='ff6d6dff'

[border]
width=3
radius=5
selection-radius=5

[key-bindings]
cancel='Escape'
execute='Return'
