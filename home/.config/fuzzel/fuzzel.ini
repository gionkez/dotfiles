[main]
font='Iosevka NFM:size=12:weight=normal'
use-bold=yes
placeholder='..'
prompt='> '
icons-enabled=false
hide-before-typing=yes
match-mode=fzf
sort-result=yes
match-counter=no
anchor=bottom-left
x-margin=15
y-margin=15
lines=2
horizontal-pad=10
vertical-pad=10
inner-pad=0
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
auto-select=yes
enable-mouse=yes

[colors]
background='fffcffff'
text='191719ff'
prompt='cf68d9ff'
placeholder='cf68d9ff'
input='191719ff'
match='cf68d9ff'
selection='00918bff'
selection-text='191719ff'
selection-match='fffcffff'
border='00918bff'

[border]
width=3
radius=5
selection-radius=5

[key-bindings]
cancel='Escape'
execute='Return'
