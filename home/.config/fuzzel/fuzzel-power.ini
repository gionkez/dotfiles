[main]
font='Iosevka NFM:size=12:weight=normal'
use-bold=yes
dpi-aware=no
gamma-correct=no
anchor=top
y-margin=15
lines=3
width=15
hide-prompt=yes
minimal-lines=yes
horizontal-pad=10
vertical-pad=10
inner-pad=0
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
cache=/dev/null
auto-select=no
enable-mouse=yes

[colors]
background='fffcffff'
text='171917ff'
prompt='008b8bff'
placeholder='008b8bff'
input='171917ff'
match='008b8bff'
selection='ff6d6dff'
selection-text='171917ff'
selection-match='fffcffff'
border='ff6d6dff'

[border]
width=3
radius=5
selection-radius=5

[key-bindings]
cancel='Escape'
execute='Return'
