[main]
font='Iosevka NFM:size=12:weight=normal'
use-bold=yes 
icons-enabled=no
anchor=top
x-margin=15
y-margin=15
lines=3
minimal-lines=yes
horizontal-pad=10
vertical-pad=10
inner-pad=0
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
auto-select=no
enable-mouse=yes

[colors]
background='fffcfffff'
background='fffcffff'
text='191719ff'
selection='00918bff'
selection-text='191719ff'
border='00918bff'

[border]
width=3
radius=5
selection-radius=5

[key-bindings]
cancel='Escape'
execute='Return'
