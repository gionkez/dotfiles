general {
    ignore_empty_inputs = true
    hide_cursor = true
}

animation {
    enabled = false
}

background {
    blur_size = 3
    blur_passes = 3
    path = screenshot
}

input-field {
    rounding = 5
    dots_spacing = 0.3
    dots_center = true
    valign = center
    halign = center
    dots_size = 0.1
    font_family = Iosevka NFM
    fail_text = wrong password
    outline_thickness = 3
    placeholder_text = 
    outer_color = rgba(00918BFF)
    font_color = rgba(171917FF)
    size = 100, 50
    inner_color = rgba(FFFCFFFF)
    fail_color = rgba(CF68D9FF)
}

label {
    color = rgba(FFFCFFFF)
    font_family = Iosevka NFM
    font_size = 24
    position = 0, 50
    text = $TIME
}